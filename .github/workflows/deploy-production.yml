# GORAZUS ERP — deploy a producción.
# Ver docs/architecture/31-infraestructura-completa.md §8.
# Disparo manual (workflow_dispatch) o tag de release — NUNCA
# automático en push. Promociona el artefacto YA validado en staging
# (misma imagen por digest, no rebuild) — requiere aprobación de un
# GitHub Environment protegido con reviewers designados.
#
# NOTA: mismo estado que deploy-staging.yml — los pasos de
# push/kubectl quedan como placeholder hasta que exista el registry y
# los manifiestos de infra/kubernetes/overlays/production.

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'SHA o tag de la imagen ya validada en staging (no se reconstruye)'
        required: true
  release:
    types: [published]

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production # Environment protegido con reviewers, configurado en GitHub — secrets de production nunca legibles desde staging
    steps:
      - uses: actions/checkout@v4

      # NOTA (FASE 05, 2026-07-20): infra/kubernetes/overlays/production ya existe y está
      # validado con `kubectl kustomize` (ver infra/kubernetes/README.md) — los pasos de
      # abajo siguen comentados porque el REGISTRY/CLUSTER reales no están provisionados.

