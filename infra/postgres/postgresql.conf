# GORAZUS ERP — PostgreSQL, configuración base para desarrollo local.
# El schema/extensiones/tablas son responsabilidad de docs/database/sql/
# (fuente de verdad, no se toca acá) — este archivo es tuning de motor,
# no de schema.
#
# Valores de referencia para un contenedor de dev en un solo host, sin
# hardware de producción todavía definido. El sizing real de
# producción (shared_buffers/work_mem contra RAM real del nodo K8s,
# max_connections contra el pool real de apps/api) es una decisión de
# ops que se toma con el operator de Postgres
# (docs/architecture/31-infraestructura-completa.md §2.2 — CloudNativePG
# o Zalando postgres-operator), no un valor fijo acá.

listen_addresses = '*'
max_connections = 100

# Logging — igual criterio que el resto de la plataforma: JSON
# estructurado, correlacionable (ver docs/architecture/07 §6). El log
# de Postgres es infraestructura, no pasa por core/http, así que queda
# en texto plano estándar acá; su agregación a Loki (31 §9) no
# distingue formato de origen.
log_min_duration_statement = 500 # ms — superficie temprano queries lentas en dev, antes de llegar a producción con volumen real

# Ver docs/database/10-estrategia-alta-disponibilidad.md — WAL en modo
# replica ya deja la puerta abierta a un standby sin reconfigurar
wal_level = replica
