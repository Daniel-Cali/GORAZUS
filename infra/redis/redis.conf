# GORAZUS ERP — Redis, configuración base.
# Ver docs/architecture/08-infraestructura-y-despliegue.md §3: tres
# usos sin mezclarlos (cache:*, ws:*, lock:*) — la política de
# eviction de acá debe tolerar que `cache:*` se purgue bajo presión de
# memoria sin afectar `ws:*`/`lock:*`, que son de corta vida por diseño
# y no deberían acumular suficiente volumen para ser el problema.
#
# Valores de referencia para desarrollo local (contenedor único, sin
# límites de hardware real todavía definidos) — el sizing de
# producción es una decisión de ops/K8s (HPA + límites de recursos,
# ver 31-infraestructura-completa.md §2.2), no de este archivo.

maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistencia mínima — Redis acá es cache/sesión/lock, no store de
# registro (eso es Postgres). RDB snapshot ocasional alcanza; no se
# habilita AOF por el mismo motivo.
save 300 10

appendonly no
