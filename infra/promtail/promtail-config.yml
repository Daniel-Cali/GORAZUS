# GORAZUS ERP — recolecta stdout de los contenedores Docker y lo envía a
# Loki, parseando el JSON estructurado que core/logging/logger.service.ts ya
# emite ({"timestamp","level","message","requestId",...}) para poder filtrar
# por `level`/`requestId` en Grafana sin re-parsear texto libre. En
# Kubernetes, el DaemonSet equivalente (Promtail o Grafana Alloy) lee del
# runtime de contenedores del cluster, no del socket de Docker (ver
# docs/architecture/31-infraestructura-completa.md §9).
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            request_id: requestId
      - labels:
          level:
          request_id:
