# GORAZUS ERP — reverse proxy, único punto de entrada.
# Ver docs/architecture/08-infraestructura-y-despliegue.md §2.
# Un único dominio para frontend y backend evita CORS en producción;
# en desarrollo local, Vite proxy cumple el mismo rol (no se pasa por
# este nginx en `pnpm nx serve web`).
#
# HTTPS (FASE 05, 2026-07-20): antes no había ningún mecanismo de TLS, ni
# documentado ni implementado. Acá, certificado autofirmado para desarrollo
# local (ver infra/nginx/generate-dev-cert.sh, nunca commiteado — gitignored)
# — en Kubernetes (staging/production reales) TLS lo termina cert-manager en
# el recurso Ingress (infra/kubernetes/base/ingress.yaml), este bloque no
# aplica ahí.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirección HTTP → HTTPS, salvo el healthcheck (K8s/Docker lo pega
    # directo por HTTP, no tiene sentido forzarlo a negociar TLS solo para
    # decir "estoy vivo").
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeceras de seguridad — ver docs/standards/SECURITY_GUIDELINES.md.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Bug real encontrado en FASE 05 (2026-07-20, primera vez que se probó
    # esta cadena completa de punta a punta): `proxy_pass` con "/" al final
    # recorta el prefijo "/api/" ya calzado por el `location` antes de
    # reenviar — pero `apps/api` tiene `setGlobalPrefix('api')`
    # (`apps/api/src/main.ts`) y espera ESE MISMO prefijo en la ruta
    # entrante. Sin barra final acá, nginx reenvía la URI completa sin
    # tocarla (`/api/v1/...` llega intacto) — confirmado con
    # `curl https://localhost/api/v1/health/live`, devolvía 404 antes de
    # este fix.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html; # build de apps/web
        try_files $uri /index.html;
    }

    # Endpoint interno para el HEALTHCHECK de Docker/Kubernetes — no
    # depende de que exista el build de apps/web ni de que apps/api
    # esté arriba, solo confirma que este proceso nginx responde.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
