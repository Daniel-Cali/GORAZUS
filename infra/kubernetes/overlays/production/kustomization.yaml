apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

images:
  - name: gorazus/api
    newTag: production # sobreescrito en CI por el SHA/tag real ya validado en staging (deploy-production.yml, promoción sin rebuild)
  - name: gorazus/web
    newTag: production

replicas:
  - name: api
    count: 3
  - name: web
    count: 2

patches:
  - target:
      kind: Ingress
      name: gorazus
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: gorazus.example.com
      - op: replace
        path: /spec/rules/0/host
        value: gorazus.example.com
  - target:
      kind: ConfigMap
      name: api-config
    patch: |-
      - op: replace
        path: /data/CORS_ORIGIN
        value: https://gorazus.example.com
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 500m, memory: 1Gi }
          limits: { cpu: "2", memory: 2Gi }
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: web
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: api
