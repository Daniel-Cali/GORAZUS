# GORAZUS ERP — Deployment de apps/api (monolito modular, múltiples réplicas
# del mismo Deployment — ver docs/architecture/31-infraestructura-completa.md
# §2: "K8s es una decisión de plataforma de orquestación, ortogonal a la
# estrategia de monolito modular", NUNCA 21 servicios separados).
# `/health/live`/`/health/ready` son `@Public()` (FASE 05, 2026-07-20 — bug
# real corregido: antes devolvían 401 bajo el JwtAuthGuard global, lo que
# hubiera dejado a todo pod fuera de servicio en el probe para siempre).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: gorazus
spec:
  replicas: 1 # sobreescrito por overlay (staging/production)
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: gorazus
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9464'
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: gorazus/api:latest # sobreescrito por overlay vía kustomize `images:`
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # ts-node/pnpm escriben caches en tiempo de ejecución
            capabilities:
              drop: ['ALL']
      terminationGracePeriodSeconds: 30 # tiempo para drenar conexiones/transacciones en curso antes de SIGKILL
