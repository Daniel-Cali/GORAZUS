# Autoescalado de `api` por CPU/memoria — ver docs/architecture/
# 31-infraestructura-completa.md §2.2. Umbrales conservadores en base/,
# ajustados por overlay si hace falta.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # evita "flapping" — no reduce réplicas ante una caída momentánea de carga
