# GORAZUS ERP — Deployment de apps/web: nginx sirviendo el build estático de
# Vite. La imagen `gorazus/web:*` (target `production` del Dockerfile) es un
# contenedor de un solo uso que copia su build y termina — acá se reutiliza
# exactamente esa misma imagen como `initContainer` (copia a un `emptyDir`
# compartido) en vez de inventar un mecanismo de build distinto para K8s,
# ver docs/architecture/08-infraestructura-y-despliegue.md §1 nota de
# apps/web/Dockerfile ("no corre Node en producción, solo assets").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: gorazus
spec:
  replicas: 1 # sobreescrito por overlay
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: gorazus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # usuario nginx de nginx:1.27-alpine
        fsGroup: 101
      initContainers:
        - name: copy-web-build
          image: gorazus/web:latest # sobreescrito por overlay vía kustomize `images:` — target "production" del Dockerfile
          command: ['sh', '-c', 'cp -r /dist/. /shared/']
          volumeMounts:
            - name: web-dist
              mountPath: /shared
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: web-dist
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
      volumes:
        - name: web-dist
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: web-nginx-conf
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
