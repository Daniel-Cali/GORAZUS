# Mismas reglas que infra/nginx/nginx.conf (ver docs/architecture/
# 08-infraestructura-y-despliegue.md §2) expresadas como ConfigMap — la
# única diferencia real es `proxy_pass http://api:3000/`, que en K8s
# resuelve por DNS interno al Service `api` (mismo namespace), no por el
# nombre de servicio de Docker Compose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx-conf
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        # Sin barra final en proxy_pass — ver infra/nginx/nginx.conf para el
        # bug real que esto evita (nginx recortaba "/api/" antes de
        # reenviar, pero apps/api espera ese mismo prefijo, setGlobalPrefix('api')).
        location /api/ {
            proxy_pass http://api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://api:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
